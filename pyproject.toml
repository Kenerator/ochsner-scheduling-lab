[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ochsner-scheduling-lab"
version = "0.1.0"
description = "Synthetic appointment scheduling Lab with guarded AI actions"
requires-python = ">=3.11"
dependencies = ["marimo==0.25.1", "zen-engine==2.1.2"]

[project.optional-dependencies]
bootstrap = ["specify-cli @ git+https://github.com/github/spec-kit.git@f1d3a4f8337ebbd3ae22760a9c12e3352b93a175"]

[project.scripts]
poc-template = "poc_template.__main__:main"
poc-demo = "poc_demo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
